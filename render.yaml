services:
  - type: web
    name: library-management-system
    runtime: java
    plan: free
    buildCommand: mvn clean package -DskipTests
    startCommand: java -cp "target/classes:target/dependency/*" com.library.Main
    envVars:
      - key: JAVA_VERSION
        value: "17"
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        value: postgres
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
