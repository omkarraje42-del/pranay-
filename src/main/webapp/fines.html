<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fines & Payments - Library Management System</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="app-wrapper">
    <aside id="sidebar-container"></aside>

    <div class="main-wrapper">
        <header id="header-container"></header>

        <main class="content-container">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
                <div>
                    <h5 class="fw-bold mb-1">Fine Management</h5>
                    <p class="text-muted small mb-0">Track patron overdue assessments, collect payments, and log authorized waivers</p>
                </div>
            </div>

            <!-- Filter Bar -->
            <div class="filter-bar">
                <select class="form-select" id="fineStatusFilter" style="max-width: 200px;">
                    <option value="">All Fines</option>
                    <option value="UNPAID">Outstanding (Unpaid)</option>
                    <option value="PAID">Collected (Paid)</option>
                    <option value="WAIVED">Waived</option>
                </select>

                <button class="btn btn-outline-secondary ms-auto" onclick="loadFines()">
                    <i class="bi bi-arrow-clockwise me-1"></i> Refresh
                </button>
            </div>

            <!-- Fines Table -->
            <div class="app-card">
                <div class="table-responsive">
                    <table class="table table-custom table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Fine #</th>
                                <th>Patron Member</th>
                                <th>Associated Book</th>
                                <th>Reason</th>
                                <th class="text-center">Amount</th>
                                <th>Date Assessed</th>
                                <th>Status</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="finesTableBody">
                            <tr><td colspan="8" class="text-center py-5 text-muted">Loading fines...</td></tr>
                        </tbody>
                    </table>
                </div>

                <div class="app-card-header bg-light py-2">
                    <span class="small text-muted" id="finePaginationInfo">Showing 0 of 0 fines</span>
                    <div id="finePaginationContainer"></div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Modal: Record Payment -->
<div class="modal fade" id="payModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">Collect Fine Payment</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="payForm">
                <div class="modal-body">
                    <input type="hidden" id="payFineId">
                    <div class="p-3 bg-light rounded border mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <span class="text-muted small">Patron:</span>
                            <span class="fw-bold" id="payMemberName">—</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="text-muted small">Amount Due:</span>
                            <span class="fw-bold fs-5 text-danger" id="payAmount">—</span>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Payment Method <span class="text-danger">*</span></label>
                        <select class="form-select" id="payMethod" required>
                            <option value="CASH">Cash</option>
                            <option value="CARD">Credit / Debit Card</option>
                            <option value="UPI">UPI / Digital Payment</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Receipt Number</label>
                        <input type="text" class="form-control" id="payReceipt" placeholder="Auto-generated if left blank">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-success btn-sm fw-semibold" id="confirmPayBtn">
                        <i class="bi bi-cash me-1"></i> Confirm Payment
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal: Waive Fine -->
<div class="modal fade" id="waiveModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold text-warning">Waive Fine</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="waiveForm">
                <div class="modal-body">
                    <input type="hidden" id="waiveFineId">
                    <div class="p-3 bg-light rounded border mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <span class="text-muted small">Patron:</span>
                            <span class="fw-bold" id="waiveMemberName">—</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="text-muted small">Amount to Waive:</span>
                            <span class="fw-bold fs-5 text-danger" id="waiveAmount">—</span>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Waiver Reason / Justification <span class="text-danger">*</span></label>
                        <textarea class="form-control" id="waiveReason" rows="3" required placeholder="State authorized justification for waiving fine (e.g. Medical emergency, Librarian discretion)..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-warning btn-sm fw-semibold" id="confirmWaiveBtn">
                        <i class="bi bi-shield-x me-1"></i> Authorize Waiver
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/fines.js"></script>
<script>
    Layout.render('Fines & Financials');
</script>
</body>
</html>
