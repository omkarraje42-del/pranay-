<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error - Library Management System</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-3">

<div class="text-center" style="max-width: 520px;">
    <div class="mb-4">
        <i class="bi bi-cpu text-danger" style="font-size: 5rem;"></i>
    </div>
    <h1 class="display-4 fw-bold text-dark">500</h1>
    <h4 class="fw-semibold text-secondary mb-3">Internal System Error</h4>
    <p class="text-muted mb-4">
        An unexpected server error occurred while processing your request. Please try again in a few moments or contact your system administrator.
    </p>
    <div class="d-flex justify-content-center gap-3">
        <button onclick="window.location.reload()" class="btn btn-primary d-inline-flex align-items-center gap-2">
            <i class="bi bi-arrow-clockwise"></i>
            <span>Try Again</span>
        </button>
        <a href="dashboard.html" class="btn btn-outline-secondary d-inline-flex align-items-center gap-2">
            <i class="bi bi-house-door"></i>
            <span>Return to Home</span>
        </a>
    </div>
</div>

</body>
</html>
