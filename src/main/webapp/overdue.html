<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overdue Books - Library Management System</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="app-wrapper">
    <aside id="sidebar-container"></aside>

    <div class="main-wrapper">
        <header id="header-container"></header>

        <main class="content-container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h5 class="fw-bold mb-1 text-danger"><i class="bi bi-exclamation-triangle-fill me-2"></i>Overdue Book Loans</h5>
                    <p class="text-muted small mb-0">Active borrowings that have exceeded their designated return due dates</p>
                </div>
                <button class="btn btn-outline-secondary btn-sm" onclick="loadOverdues()">
                    <i class="bi bi-arrow-clockwise me-1"></i> Refresh
                </button>
            </div>

            <!-- Overdue Table -->
            <div class="app-card">
                <div class="table-responsive">
                    <table class="table table-custom table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Book Title</th>
                                <th>Accession No.</th>
                                <th>Borrower (Member)</th>
                                <th>Contact Email</th>
                                <th>Due Date</th>
                                <th class="text-center">Days Overdue</th>
                                <th class="text-center">Accrued Fine</th>
                                <th class="text-end">Action</th>
                            </tr>
                        </thead>
                        <tbody id="overdueTableBody">
                            <tr><td colspan="8" class="text-center py-5 text-muted">Checking overdue loans...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/auth.js"></script>
<script>
    Layout.render('Overdue Books');

    document.addEventListener('DOMContentLoaded', loadOverdues);

    async function loadOverdues() {
        const tbody = document.getElementById('overdueTableBody');
        tbody.innerHTML = '<tr><td colspan="8" class="text-center py-4 text-muted"><span class="spinner-border spinner-border-sm me-2"></span>Loading overdue records...</td></tr>';

        try {
            const resp = await API.get('/api/loans/overdue');
            if (!resp || !resp.success) return;

            const loans = resp.data || [];
            if (loans.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" class="text-center py-5">
                            <i class="bi bi-check-circle-fill fs-1 text-success d-block mb-2"></i>
                            <h6 class="text-success fw-semibold">No Overdue Books!</h6>
                            <p class="text-muted small">All active circulation loans are within their valid due dates.</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = loans.map(l => {
                const fineAmt = l.overdueDays * 5.0; // ₹5 per day
                return `
                    <tr>
                        <td>
                            <div class="fw-bold text-dark">${l.bookTitle}</div>
                            <small class="text-muted">ISBN: ${l.isbn || 'N/A'}</small>
                        </td>
                        <td><code>${l.accessionNumber}</code></td>
                        <td>
                            <div class="fw-semibold">${l.memberName}</div>
                            <small class="text-muted">${l.membershipNumber}</small>
                        </td>
                        <td><small>${l.memberEmail || '—'}</small></td>
                        <td class="text-danger fw-semibold">${UI.formatDate(l.dueDate)}</td>
                        <td class="text-center">
                            <span class="badge bg-danger-subtle text-danger fs-6 fw-bold">${l.overdueDays} days</span>
                        </td>
                        <td class="text-center fw-bold text-danger">₹${fineAmt.toFixed(2)}</td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-success" onclick="processOverdueReturn(${l.id}, '${l.accessionNumber}')" data-role="STAFF">
                                <i class="bi bi-box-arrow-in-left me-1"></i> Return
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');

            Auth.applyRoleRestrictions();

        } catch (e) {
            tbody.innerHTML = `<tr><td colspan="8" class="text-center text-danger py-4">Error loading overdue books: ${e.message}</td></tr>`;
        }
    }

    async function processOverdueReturn(loanId, accession) {
        UI.confirm(
            'Confirm Overdue Return',
            `Process return for copy ${accession}? Overdue fine will be automatically assessed.`,
            async () => {
                try {
                    await API.post(`/api/loans/${loanId}/return`, { notes: 'Returned from overdue monitor' });
                    UI.toast('Return recorded and fine assessed', 'success');
                    loadOverdues();
                } catch (err) {
                    UI.toast(err.message, 'error');
                }
            }
        );
    }
</script>
</body>
</html>
