<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Access Forbidden - Library Management System</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-3">

<div class="text-center" style="max-width: 520px;">
    <div class="mb-4">
        <i class="bi bi-shield-slash-fill text-danger" style="font-size: 5rem;"></i>
    </div>
    <h1 class="display-4 fw-bold text-dark">403</h1>
    <h4 class="fw-semibold text-secondary mb-3">Access Denied / Forbidden</h4>
    <p class="text-muted mb-4">
        You do not have the required permissions or role privileges to access this protected library resource.
    </p>
    <div class="d-flex justify-content-center gap-3">
        <a href="dashboard.html" class="btn btn-primary d-inline-flex align-items-center gap-2">
            <i class="bi bi-speedometer2"></i>
            <span>Return to Dashboard</span>
        </a>
        <a href="login.html" class="btn btn-outline-secondary d-inline-flex align-items-center gap-2">
            <i class="bi bi-box-arrow-in-right"></i>
            <span>Switch Account</span>
        </a>
    </div>
</div>

</body>
</html>
