<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - Library Management System</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="app-wrapper">
    <aside id="sidebar-container"></aside>

    <div class="main-wrapper">
        <header id="header-container"></header>

        <main class="content-container">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
                <div>
                    <h5 class="fw-bold mb-1">Book Categories</h5>
                    <p class="text-muted small mb-0">Manage disciplinary subjects and classification metadata</p>
                </div>
                <button class="btn btn-primary d-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#catModal" onclick="openCreateCategoryModal()" data-role="STAFF">
                    <i class="bi bi-plus-lg"></i>
                    <span>Add Category</span>
                </button>
            </div>

            <!-- Categories Table -->
            <div class="app-card">
                <div class="table-responsive">
                    <table class="table table-custom table-hover align-middle">
                        <thead>
                            <tr>
                                <th style="width: 60px;">#</th>
                                <th>Category Name</th>
                                <th>Description</th>
                                <th class="text-center">Books Count</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="categoryTableBody">
                            <tr><td colspan="5" class="text-center py-5 text-muted">Loading categories...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Modal: Category -->
<div class="modal fade" id="catModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="catModalTitle">Add Category</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="catForm">
                <div class="modal-body">
                    <input type="hidden" id="catId">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Category Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="catName" required placeholder="e.g. Artificial Intelligence">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Description</label>
                        <textarea class="form-control" id="catDescription" rows="3" placeholder="Category scope..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary btn-sm fw-semibold" id="saveCatBtn">Save Category</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/auth.js"></script>
<script>
    Layout.render('Book Categories');
    let catModalInstance = null;

    document.addEventListener('DOMContentLoaded', () => {
        catModalInstance = new bootstrap.Modal(document.getElementById('catModal'));
        loadCategories();
        document.getElementById('catForm').onsubmit = handleSaveCategory;
    });

    async function loadCategories() {
        const tbody = document.getElementById('categoryTableBody');
        tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted"><span class="spinner-border spinner-border-sm me-2"></span>Loading...</td></tr>';
        try {
            const resp = await API.get('/api/categories');
            if (!resp || !resp.success) return;

            const list = resp.data || [];
            if (list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">No categories created yet</td></tr>';
                return;
            }

            tbody.innerHTML = list.map(c => `
                <tr>
                    <td><code>#${c.id}</code></td>
                    <td class="fw-bold text-dark">${c.name}</td>
                    <td><small class="text-muted">${c.description || '—'}</small></td>
                    <td class="text-center"><span class="badge bg-primary-subtle text-primary">${c.bookCount} books</span></td>
                    <td class="text-end">
                        <div class="btn-group btn-group-sm" data-role="STAFF">
                            <button class="btn btn-outline-secondary" onclick="openEditCategoryModal(${c.id}, '${escapeQuote(c.name)}', '${escapeQuote(c.description)}')">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-outline-danger" onclick="deleteCategory(${c.id}, '${escapeQuote(c.name)}')">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');

            Auth.applyRoleRestrictions();
        } catch (e) {
            tbody.innerHTML = `<tr><td colspan="5" class="text-center text-danger py-4">Error: ${e.message}</td></tr>`;
        }
    }

    function openCreateCategoryModal() {
        document.getElementById('catModalTitle').textContent = 'Add Category';
        document.getElementById('catForm').reset();
        document.getElementById('catId').value = '';
    }

    function openEditCategoryModal(id, name, desc) {
        document.getElementById('catModalTitle').textContent = 'Edit Category: ' + name;
        document.getElementById('catId').value = id;
        document.getElementById('catName').value = name;
        document.getElementById('catDescription').value = desc || '';
        catModalInstance.show();
    }

    async function handleSaveCategory(e) {
        e.preventDefault();
        const id = document.getElementById('catId').value;
        const name = document.getElementById('catName').value.trim();
        const description = document.getElementById('catDescription').value.trim();

        const btn = document.getElementById('saveCatBtn');
        btn.disabled = true;

        try {
            if (id) {
                await API.put(`/api/categories/${id}`, { name, description });
                UI.toast('Category updated successfully', 'success');
            } else {
                await API.post('/api/categories', { name, description });
                UI.toast('Category created successfully', 'success');
            }
            catModalInstance.hide();
            loadCategories();
        } catch (err) {
            UI.toast(err.message, 'error');
        } finally {
            btn.disabled = false;
        }
    }

    function deleteCategory(id, name) {
        UI.confirm(
            'Delete Category',
            `Are you sure you want to delete category "${name}"?`,
            async () => {
                try {
                    await API.delete(`/api/categories/${id}`);
                    UI.toast('Category deleted', 'success');
                    loadCategories();
                } catch (err) {
                    UI.toast(err.message, 'error');
                }
            }
        );
    }

    function escapeQuote(str) {
        if (!str) return '';
        return str.replace(/'/g, "\\'");
    }
</script>
</body>
</html>
