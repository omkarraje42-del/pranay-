<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Transactions - Library Management System</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="app-wrapper">
    <aside id="sidebar-container"></aside>

    <div class="main-wrapper">
        <header id="header-container"></header>

        <main class="content-container">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
                <div>
                    <h5 class="fw-bold mb-1">Loan Transactions</h5>
                    <p class="text-muted small mb-0">Track all circulation check-outs, returns, due dates, and assess overdue fines</p>
                </div>
                <a href="issue-book.html" class="btn btn-primary d-flex align-items-center gap-2" data-role="STAFF">
                    <i class="bi bi-box-arrow-up-right"></i>
                    <span>Issue New Loan</span>
                </a>
            </div>

            <!-- Filter Bar -->
            <div class="filter-bar">
                <div class="input-group" style="max-width: 350px;">
                    <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
                    <input type="text" class="form-control" id="searchLoanInput" placeholder="Search book, patron, barcode...">
                </div>

                <select class="form-select" id="loanStatusFilter" style="max-width: 180px;">
                    <option value="">All Statuses</option>
                    <option value="ACTIVE">Active (Current)</option>
                    <option value="OVERDUE">Overdue Only</option>
                    <option value="RETURNED">Returned</option>
                </select>

                <button class="btn btn-outline-secondary ms-auto" id="resetLoanFiltersBtn">
                    <i class="bi bi-arrow-counterclockwise"></i> Reset
                </button>
            </div>

            <!-- Loans Table -->
            <div class="app-card">
                <div class="table-responsive">
                    <table class="table table-custom table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Loan #</th>
                                <th>Book Title</th>
                                <th>Accession No.</th>
                                <th>Borrower (Member)</th>
                                <th>Issue Date</th>
                                <th>Due Date</th>
                                <th>Return Date</th>
                                <th>Status</th>
                                <th class="text-end">Action</th>
                            </tr>
                        </thead>
                        <tbody id="loansTableBody">
                            <tr><td colspan="9" class="text-center py-5 text-muted">Loading loans...</td></tr>
                        </tbody>
                    </table>
                </div>

                <div class="app-card-header bg-light py-2">
                    <span class="small text-muted" id="loanPaginationInfo">Showing 0 of 0 loans</span>
                    <div id="loanPaginationContainer"></div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Modal: Process Return -->
<div class="modal fade" id="returnModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">Accept Returned Book</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="returnForm">
                <div class="modal-body">
                    <input type="hidden" id="returnLoanId">
                    <div class="p-3 bg-light rounded border mb-3">
                        <div class="fw-bold" id="returnBookTitle">—</div>
                        <div class="small text-muted mb-2" id="returnMemberName">—</div>
                        <div class="d-flex justify-content-between small py-1 border-top">
                            <span>Accession:</span>
                            <code id="returnAccession">—</code>
                        </div>
                        <div class="d-flex justify-content-between small py-1">
                            <span>Due Date:</span>
                            <span id="returnDueDate">—</span>
                        </div>
                    </div>

                    <div id="overdueNotice" class="alert alert-warning py-2 small d-none">
                        <!-- Populated if overdue -->
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Check-in Notes / Condition</label>
                        <textarea class="form-control" id="returnNotes" rows="2" placeholder="e.g. Returned in good condition..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-success btn-sm fw-semibold" id="confirmReturnBtn">
                        <i class="bi bi-check2-circle me-1"></i> Confirm Return
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/loans.js"></script>
<script>
    Layout.render('Circulation Loans');
</script>
</body>
</html>
