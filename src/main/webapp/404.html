<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found - Library Management System</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-3">

<div class="text-center" style="max-width: 520px;">
    <div class="mb-4">
        <i class="bi bi-journal-x text-warning" style="font-size: 5rem;"></i>
    </div>
    <h1 class="display-4 fw-bold text-dark">404</h1>
    <h4 class="fw-semibold text-secondary mb-3">Catalogue Page Not Found</h4>
    <p class="text-muted mb-4">
        The page or resource you requested could not be found or has been moved within the library catalogue.
    </p>
    <div class="d-flex justify-content-center gap-3">
        <a href="dashboard.html" class="btn btn-primary d-inline-flex align-items-center gap-2">
            <i class="bi bi-speedometer2"></i>
            <span>Return to Dashboard</span>
        </a>
        <a href="books.html" class="btn btn-outline-secondary d-inline-flex align-items-center gap-2">
            <i class="bi bi-search"></i>
            <span>Browse Books</span>
        </a>
    </div>
</div>

</body>
</html>
