<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservations - Library Management System</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="app-wrapper">
    <aside id="sidebar-container"></aside>

    <div class="main-wrapper">
        <header id="header-container"></header>

        <main class="content-container">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
                <div>
                    <h5 class="fw-bold mb-1">Reservation Queue</h5>
                    <p class="text-muted small mb-0">Prioritized waiting queues for titles that are currently checked out or reserved</p>
                </div>
                <button class="btn btn-primary d-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#reservationModal">
                    <i class="bi bi-clock-history"></i>
                    <span>Place Reservation</span>
                </button>
            </div>

            <!-- Filter Bar -->
            <div class="filter-bar">
                <select class="form-select" id="resStatusFilter" style="max-width: 200px;">
                    <option value="">All Statuses</option>
                    <option value="WAITING">Waiting in Queue</option>
                    <option value="READY_FOR_PICKUP">Ready for Pickup</option>
                    <option value="FULFILLED">Fulfilled</option>
                    <option value="CANCELLED">Cancelled</option>
                </select>

                <button class="btn btn-outline-secondary ms-auto" onclick="loadReservations()">
                    <i class="bi bi-arrow-clockwise me-1"></i> Refresh
                </button>
            </div>

            <!-- Reservations Table -->
            <div class="app-card">
                <div class="table-responsive">
                    <table class="table table-custom table-hover align-middle">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Book Title</th>
                                <th>Member Patron</th>
                                <th>Reservation Date</th>
                                <th class="text-center">Priority</th>
                                <th>Status</th>
                                <th>Pickup Deadline</th>
                                <th class="text-end">Action</th>
                            </tr>
                        </thead>
                        <tbody id="reservationsTableBody">
                            <tr><td colspan="8" class="text-center py-5 text-muted">Loading reservations...</td></tr>
                        </tbody>
                    </table>
                </div>

                <div class="app-card-header bg-light py-2">
                    <span class="small text-muted" id="resPaginationInfo">Showing 0 of 0 reservations</span>
                    <div id="resPaginationContainer"></div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Modal: Place Reservation -->
<div class="modal fade" id="reservationModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">Place Title Reservation</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="reservationForm">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Select Book Title <span class="text-danger">*</span></label>
                        <select class="form-select" id="resBookSelect" required>
                            <option value="">Loading books...</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Select Patron Member <span class="text-danger">*</span></label>
                        <select class="form-select" id="resMemberSelect" required>
                            <option value="">Loading members...</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Notes / Reservation Reason</label>
                        <input type="text" class="form-control" id="resNotes" placeholder="e.g. Research thesis reference">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary btn-sm fw-semibold" id="submitResBtn">
                        <i class="bi bi-clock me-1"></i> Place in Queue
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/reservations.js"></script>
<script>
    Layout.render('Reservation Queue');
</script>
</body>
</html>
