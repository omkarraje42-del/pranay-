<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User & Staff Management - Library Management System</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="app-wrapper">
    <!-- Sidebar -->
    <aside id="sidebar-container"></aside>

    <div class="main-wrapper">
        <!-- Header -->
        <header id="header-container"></header>

        <!-- Main Content -->
        <main class="content-container">
            <!-- Header bar -->
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
                <div>
                    <h5 class="fw-bold mb-1">User & Staff Accounts</h5>
                    <p class="text-muted small mb-0">Manage library staff credentials, administrator privileges, and role permissions</p>
                </div>
                <button class="btn btn-primary d-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#userModal" onclick="openCreateUserModal()">
                    <i class="bi bi-person-plus-fill"></i>
                    <span>Create User</span>
                </button>
            </div>

            <!-- Filter / Search Toolbar -->
            <div class="filter-bar">
                <div class="search-input-group">
                    <i class="bi bi-search"></i>
                    <input type="text" class="form-control form-control-sm" id="userSearchInput" placeholder="Search by name, username, or email...">
                </div>

                <div class="d-flex align-items-center gap-2">
                    <label class="small text-muted fw-semibold">Role:</label>
                    <select class="form-select form-select-sm" id="roleFilter" style="width: 150px;">
                        <option value="">All Roles</option>
                        <option value="1">ADMIN</option>
                        <option value="2">LIBRARIAN</option>
                        <option value="3">MEMBER</option>
                    </select>
                </div>

                <div class="d-flex align-items-center gap-2">
                    <label class="small text-muted fw-semibold">Status:</label>
                    <select class="form-select form-select-sm" id="statusFilter" style="width: 130px;">
                        <option value="">All</option>
                        <option value="true">Active</option>
                        <option value="false">Inactive</option>
                    </select>
                </div>

                <button class="btn btn-sm btn-outline-secondary ms-auto" onclick="resetFilters()">
                    <i class="bi bi-x-circle me-1"></i> Reset
                </button>
            </div>

            <!-- Users Table Card -->
            <div class="app-card">
                <div class="table-responsive">
                    <table class="table table-custom table-hover align-middle">
                        <thead>
                            <tr>
                                <th>User</th>
                                <th>Username</th>
                                <th>Role</th>
                                <th>Phone</th>
                                <th>Status</th>
                                <th>Created</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody">
                            <tr><td colspan="7" class="text-center py-5 text-muted"><span class="spinner-border spinner-border-sm me-2"></span>Loading users...</td></tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination footer -->
                <div class="d-flex justify-content-between align-items-center p-3 border-top" id="paginationContainer"></div>
            </div>
        </main>
    </div>
</div>

<!-- Modal: Create / Edit User -->
<div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="userModalTitle">Create User Account</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="userForm">
                <div class="modal-body">
                    <input type="hidden" id="userId">

                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">First Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="uFirstName" required placeholder="John">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Last Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="uLastName" required placeholder="Doe">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Username <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="uUsername" required placeholder="johndoe">
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Email Address <span class="text-danger">*</span></label>
                        <input type="email" class="form-control" id="uEmail" required placeholder="john.doe@example.com">
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Role <span class="text-danger">*</span></label>
                            <select class="form-select" id="uRole" required>
                                <option value="2">LIBRARIAN</option>
                                <option value="1">ADMIN</option>
                                <option value="3">MEMBER</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Phone</label>
                            <input type="tel" class="form-control" id="uPhone" placeholder="555-0100">
                        </div>
                    </div>

                    <div class="mb-3" id="passwordGroup">
                        <label class="form-label small fw-semibold">Password <span class="text-danger" id="pwdRequiredStar">*</span></label>
                        <input type="password" class="form-control" id="uPassword" placeholder="Minimum 8 characters">
                        <small class="text-muted" id="pwdHelp">Must be at least 8 characters long.</small>
                    </div>

                    <div class="form-check form-switch mt-2">
                        <input class="form-check-input" type="checkbox" id="uActive" checked>
                        <label class="form-check-label small fw-semibold" for="uActive">Account Active</label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary btn-sm fw-semibold" id="saveUserBtn">Save Account</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal: Reset Password -->
<div class="modal fade" id="resetPwdModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title fw-bold">Reset Password</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="resetPwdForm">
                <div class="modal-body">
                    <input type="hidden" id="resetUserId">
                    <p class="small text-muted mb-2">Setting a new password for <strong id="resetTargetUsername"></strong></p>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">New Password</label>
                        <input type="password" class="form-control form-control-sm" id="resetNewPassword" required minlength="8" placeholder="New password">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-danger btn-sm fw-semibold" id="confirmResetBtn">Update Password</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/users.js"></script>
</body>
</html>
