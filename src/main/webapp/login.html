<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Library Management System</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .login-card {
            background: #ffffff;
            border-radius: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
        }
        .login-header {
            background-color: #f8fafc;
            border-bottom: 1px solid var(--border-color);
            padding: 2rem 2rem 1.5rem;
            text-align: center;
        }
        .login-body {
            padding: 2rem;
        }
        .demo-badge {
            cursor: pointer;
            transition: all 0.2s;
        }
        .demo-badge:hover {
            transform: scale(1.03);
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle mb-3" style="width: 56px; height: 56px;">
            <i class="bi bi-book-half fs-2"></i>
        </div>
        <h4 class="fw-bold mb-1">Library Management System</h4>
        <p class="text-muted small mb-0">Sign in to your account to continue</p>
    </div>

    <div class="login-body">
        <div id="loginAlert" class="alert alert-danger py-2 small d-none" role="alert"></div>

        <form id="loginForm" novalidate>
            <div class="mb-3">
                <label for="username" class="form-label small fw-semibold">Username or Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="username" placeholder="Enter username or email" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label small fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                    <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2" id="submitBtn">
                <span>Sign In</span>
                <i class="bi bi-arrow-right"></i>
            </button>
        </form>

        <div class="mt-4 pt-3 border-top">
            <p class="text-muted small fw-semibold mb-2 text-center">Quick Demo Credentials:</p>
            <div class="d-flex flex-wrap gap-2 justify-content-center">
                <span class="badge bg-danger-subtle text-danger border border-danger-subtle demo-badge" data-user="admin" data-pass="Admin@123">
                    <i class="bi bi-shield-lock me-1"></i> Admin
                </span>
                <span class="badge bg-primary-subtle text-primary border border-primary-subtle demo-badge" data-user="librarian" data-pass="Admin@123">
                    <i class="bi bi-person-badge me-1"></i> Librarian
                </span>
                <span class="badge bg-success-subtle text-success border border-success-subtle demo-badge" data-user="johndoe" data-pass="Admin@123">
                    <i class="bi bi-person me-1"></i> Member
                </span>
            </div>
        </div>
    </div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script>
    // Demo credential fill shortcuts
    document.querySelectorAll('.demo-badge').forEach(badge => {
        badge.onclick = () => {
            document.getElementById('username').value = badge.getAttribute('data-user');
            document.getElementById('password').value = badge.getAttribute('data-pass');
        };
    });

    // Toggle password visibility
    const toggleBtn = document.getElementById('togglePassword');
    const passInput = document.getElementById('password');
    toggleBtn.onclick = () => {
        const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passInput.setAttribute('type', type);
        toggleBtn.innerHTML = type === 'password' ? '<i class="bi bi-eye"></i>' : '<i class="bi bi-eye-slash"></i>';
    };

    // Handle Login submission
    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('loginAlert');
    const submitBtn = document.getElementById('submitBtn');

    form.onsubmit = async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        if (!username || !password) {
            alertBox.textContent = 'Please provide both username and password';
            alertBox.classList.remove('d-none');
            return;
        }

        alertBox.classList.add('d-none');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Signing in...';

        try {
            const resp = await API.post('/api/auth/login', { username, password });
            if (resp && resp.success) {
                sessionStorage.setItem('currentUser', JSON.stringify(resp.data));
                const target = sessionStorage.getItem('redirectAfterLogin') || 'dashboard.html';
                sessionStorage.removeItem('redirectAfterLogin');
                window.location.href = target;
            } else {
                alertBox.textContent = resp.message || 'Login failed';
                alertBox.classList.remove('d-none');
            }
        } catch (err) {
            alertBox.textContent = err.message || 'An error occurred during login';
            alertBox.classList.remove('d-none');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>Sign In</span> <i class="bi bi-arrow-right"></i>';
        }
    };
</script>
</body>
</html>
